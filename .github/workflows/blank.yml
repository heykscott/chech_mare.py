name: Daily MARE Check

on:
  schedule:
    # Runs daily at 15:00 UTC (11:00 AM EDT)
    - cron: '0 15 * * *'
  workflow_dispatch: # Button to run manually whenever you want

jobs:
  run-scraper:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repo code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: setup-python@v5
        with:
          python-version: '3.11'

      - name: Install libraries
        run: pip install requests beautifulsoup4

      - name: Run script
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: python check_mare.py

      - name: Save known list
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add known_children.json
          git diff --staged --quiet || (git commit -m "Update MARE roster" && git push)
